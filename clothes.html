<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Clothing Products - Gharelu Shopping</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">


        <!-- LOGO -->

        <div class="logo">

            <a href="index.html">

                <img
                    src="images/gharelu shopping (1).png"
                    alt="Gharelu Shopping">

            </a>

        </div>


        <!-- =========================
             NAVIGATION
        ========================== -->

        <nav class="navbar">

            <a href="index.html">
                Home
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="about.html">
                About Us
            </a>

            <a href="contact.html">
                Contact Us
            </a>

        </nav>


        <!-- =========================
             RIGHT SIDE
        ========================== -->

        <div class="header-right">


            <!-- SEARCH -->

            <div class="search-box">

                <input
                    type="text"
                    placeholder="Search products..."
                >

                <button type="button">

                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>

            </div>


            <!-- PROFILE -->

            <a href="profile.html" class="profile">

                <i class="fa-solid fa-user"></i>

            </a>


            <!-- CART -->

            <a href="cart.html" class="cart">

                <i class="fa-solid fa-cart-shopping"></i>

                <span id="cartCount">0</span>

            </a>


        </div>

    </header>



    <!-- =========================
         CLOTHING SECTION
    ========================== -->

    <section class="categories">


        <h1>
            Clothing Products
        </h1>


        <p>
            Explore our clothing collection.
        </p>



        <!-- =========================
             PRODUCT CONTAINER
        ========================== -->

        <div class="category-container">


            <!-- =========================
                 PRODUCT 1
            ========================== -->

            <div class="category-card">


                <img
                    src="images/tshirt.jpg"
                    alt="T-Shirt"
                >


                <div class="category-info">


                    <h2>
                        T-Shirt
                    </h2>


                    <p>
                        Rs. 799
                    </p>


                    <button
                        class="add-cart-btn"
                        onclick="addToCart(
                            'T-Shirt',
                            799,
                            'images/tshirt.jpg'
                        )">

                        <i class="fa-solid fa-cart-plus"></i>

                        Add to Cart

                    </button>


                </div>

            </div>
