<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - Gharelu Shopping</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <!-- LOGO -->

        <div class="logo">

            <a href="index.html">

                <img
                    src="images/gharelu shopping 3.png"
                    alt="Gharelu Shopping">

            </a>

        </div>


        <!-- NAVIGATION -->

        <nav class="navbar">

            <a href="index.html">
                Home
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="about.html">
                About Us
            </a>

            <a href="contact.html">
                Contact Us
            </a>

        </nav>


        <!-- RIGHT SIDE -->

        <div class="header-right">

            <!-- SEARCH -->

            <div class="search-box">

                <input
                    type="text"
                    placeholder="Search products..."
                >

                <button type="button">

                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>

            </div>


            <!-- PROFILE -->

            <a href="profile.html" class="profile">

                <i class="fa-solid fa-user"></i>

            </a>


            <!-- CART -->

            <a href="cart.html" class="cart">

                <i class="fa-solid fa-cart-shopping"></i>

                <span id="cartCount">0</span>

            </a>

        </div>

    </header>


    <!-- =========================
         CART
    ========================== -->

    <main class="cart-page">

        <h1>
            Your Shopping Cart
        </h1>


        <div class="cart-layout">

            <!-- CART PRODUCTS -->

            <div class="cart-products">

                <div id="cartContainer">

                    <!-- JavaScript adds products here -->

                </div>

            </div>


            <!-- CART SUMMARY -->

            <div class="cart-summary">

                <h2>
                    Order Summary
                </h2>

                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span id="cartTotal">
                        Rs. 0
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery
                    </span>

                    <span>
                        Free
                    </span>

                </div>


                <hr>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <span id="summaryTotal">
                        Rs. 0
                    </span>

                </div>


                <button
                    class="checkout-btn"
                    onclick="checkout()">

                    Proceed to Checkout

                </button>


                <a
                    href="categories.html"
                    class="continue-shopping">

                    Continue Shopping

                </a>

            </div>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
