<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clothing Products</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            <img src="images/gharelu shopping 3.png" alt="Gharelu Shop">
        </div>

        <nav class="navbar">

            <a href="index.html">Home</a>

            <a href="categories.html">Categories</a>

            <a href="about.html">About Us</a>

            <a href="contact.html">Contact Us</a>

        </nav>

    </header>


    <section class="categories">

        <h1>Electronics Products</h1>

        <p>Explore our Electronics.</p>


        <div class="category-container">

            <!-- =========================
            RIGHT SIDE
        ========================== -->

        <div class="header-right">


            <!-- SEARCH -->

            <div class="search-box">

                <input
                    type="text"
                    placeholder="Search products..."
                >

                <button type="button">

                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>

            </div>
            

            <!-- Product 1 -->

            <div class="category-card">

                <img src="images/charger.jpg" alt="charger">

                <div class="category-info">

                    <h2>Type-C Charger</h2>

                    <p>Rs. 799</p>

                    <a href="#">Add to Cart</a>

                </div>

            </div>


            <!-- Product 2 -->

            <div class="category-card">

                <img src="images/shirt.jpg" alt="Earbuds">

                <div class="category-info">

                    <h2>Ultima boom sleek</h2>

                    <p>Rs. 2,000 -/</p>

                    <a href="#">Add to Cart</a>

                </div>

            </div>


            <!-- Product 3 -->

            <div class="category-card">

                <img src="images/jeans.jpg" alt="Phone">

                <div class="category-info">

                    <h2>Redmi note 12</h2>

                    <p>Rs. 28,999-/</p>

                    <a href="#">Add to Cart</a>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
